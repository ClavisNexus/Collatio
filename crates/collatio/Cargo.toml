[package]
name = "collatio"
version = "0.0.0"
description = "Verifier for Clavis receipts, records and ledger evidence."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sha2 = { version = "=0.11.1", default-features = false }
base64ct = { version = "=1.8.3", default-features = false, features = ["alloc"] }
ryu-js = { version = "=1.0.3", default-features = false }
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa"] }
ed25519-dalek = { version = "=3.0.0", default-features = false }
crypto-bigint = { version = "=0.7.5", default-features = false, features = ["alloc"] }
sha1 = { version = "=0.11.0", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dlmalloc = { version = "=0.2.14", default-features = false, features = ["global"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
arithmetic_side_effects = "deny"

[dev-dependencies]
base64ct = { version = "=1.8.3", default-features = false, features = ["alloc"] }
