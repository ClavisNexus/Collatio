name: publish

# A tag v<X.Y.Z> on main, with go/v<X.Y.Z> on the same commit, stages @clavis.nexus/collatio on npm
# through trusted publishing. The package ships the module of the reference build (repro/run.sh).
# Nothing goes live until a maintainer approves the staged package with 2FA on npmjs.com. The stage
# job holds the OIDC token and runs nothing but npm on the packed tarball.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - id: tag
        run: node tools/release-check.mjs tag "$GITHUB_REF_NAME"
      - run: node tools/check-release-age.mjs
      # rustup comes with the runner image; this installs what rust-toolchain.toml names.
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup show
      - run: cargo test --locked
      - name: Reference build
        run: repro/run.sh
      - run: npm test
        working-directory: js
        env:
          COLLATIO_WASM: ${{ github.workspace }}/repro/out-1/collatio.wasm
      # prepack copies the matching pair from repro/run.sh into js/
      - name: Pack
        working-directory: js
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          npm pack --pack-destination "$RUNNER_TEMP/dist"
          set -- "$RUNNER_TEMP"/dist/*.tgz
          [ "$#" -eq 1 ] && [ -f "$1" ] || { echo "expected one tarball in $RUNNER_TEMP/dist"; exit 1; }
          mv "$1" "$RUNNER_TEMP/dist/package.tgz"
          node ../tools/release-check.mjs tarball "$RUNNER_TEMP/dist/package.tgz" "$VERSION"
      - name: Check what the package shows
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xzf "$RUNNER_TEMP/dist/package.tgz" -C "$RUNNER_TEMP/unpacked"
          node .github/public-surface.mjs --dir "$RUNNER_TEMP/unpacked/package"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/dist/package.tgz
          if-no-files-found: error
          retention-days: 1

  stage:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # npm stage publish with trusted publishing needs npm 11.15.0 or later
      - run: |
          npm --version
          node -e 'const [a,b]=process.argv[1].split(".").map(Number);process.exit(a>11||(a===11&&b>=15)?0:1)' "$(npm --version)"
      - name: Stage on npm
        env:
          VERSION: ${{ needs.pack.outputs.version }}
        working-directory: ${{ runner.temp }}/dist
        # The integrity is taken here, where no dependency code has run, for comparison on npmjs.com
        run: |
          integrity="sha512-$(openssl dgst -sha512 -binary package.tgz | base64 -w0)"
          echo "$integrity"
          npm stage publish ./package.tgz --access public --ignore-scripts
          {
            echo "### Staged @clavis.nexus/collatio@$VERSION"
            echo ""
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- integrity: \`$integrity\`"
            echo ""
            echo "Approve it with 2FA under Staged Packages on npmjs.com."
          } >> "$GITHUB_STEP_SUMMARY"
