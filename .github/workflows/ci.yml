name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail https://sh.rustup.rs | sh -s -- -y --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - run: node tools/check-release-age.mjs
      - run: cargo test --locked
      - run: ./build.sh
      - run: npm test
        working-directory: js
      - run: go test ./...
        working-directory: go

  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: repro/run.sh
