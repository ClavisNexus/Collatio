[package]
name = "collatio-spike"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"
description = "Measurement spike for the Collatio verifier (genesis.md §18.10). Not the verifier."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa"] }
sha2 = { version = "=0.11.1", default-features = false }
crypto-bigint = { version = "=0.7.5", default-features = false, features = ["alloc"] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["alloc"] }
base64ct = { version = "=1.8.3", default-features = false, features = ["alloc"] }
ryu-js = { version = "=1.0.3", default-features = false }
dlmalloc = { version = "=0.2.14", default-features = false, features = ["global"] }
ed25519-dalek = { version = "=3.0.0", default-features = false }
# Compile-only probes for §18.10 item 7 (ASN.1 certificates, CBOR). Off by default.
x509-cert = { version = "=0.3.0", default-features = false, optional = true }
minicbor = { version = "=2.3.0", default-features = false, features = ["alloc"], optional = true }

[features]
default = []
probe = ["dep:x509-cert", "dep:minicbor"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
debug = false
strip = true
incremental = false
